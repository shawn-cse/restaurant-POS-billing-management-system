<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- UrbanBite Restaurant Horizontal Brandmark (Light Background) -->
  <g transform="translate(10, 10)">
    <!-- Plate / Cloche Emblem with Urban Architecture Line -->
    <rect width="60" height="60" rx="14" fill="#17212B"/>
    <!-- Plate Ring -->
    <circle cx="30" cy="30" r="21" stroke="#F46B45" stroke-width="2.5" stroke-opacity="0.3"/>
    <!-- Inner Plate Rim -->
    <circle cx="30" cy="30" r="16" fill="#17212B" stroke="#FFF8EE" stroke-width="1.5"/>
    <!-- Fork & Knife Urban Monogram -->
    <!-- Stylized Fork -->
    <path d="M24 20v7a2 2 0 0 0 2 2v11h2V29a2 2 0 0 0 2-2v-7" stroke="#F46B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27 20v6" stroke="#F46B45" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Stylized Knife / Architecture Curve -->
    <path d="M36 20c0 5-1.5 8-3.5 9v11h2v-14c2.5-1 3.5-3.5 3.5-6v0z" fill="#FFF8EE"/>
    <!-- Subtle Hot Steam / Bite Spark -->
    <circle cx="37" cy="16" r="2" fill="#F46B45"/>
  </g>
  <!-- Typography -->
  <text x="82" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" fill="#17212B" letter-spacing="-0.5">
    Urban<tspan fill="#F46B45">Bite</tspan>
  </text>
  <text x="83" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#35665B" letter-spacing="3.5">
    RESTAURANT &amp; POS
  </text>
</svg>
